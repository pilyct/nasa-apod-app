name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate route types
        # tsconfig.json includes .next/types/**/*.ts for Next's typed-routes
        # feature (e.g. the LayoutProps global in app/layout.tsx) — those
        # files only exist after a build or this, so tsc would otherwise
        # fail on a clean checkout with no prior local build.
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        # MOCK_APOD avoids a real network call to NASA during build — `/` is
        # statically prerendered (see app/page.tsx), so without this the
        # build would depend on NASA_API_KEY and NASA's API being reachable
        # from the CI runner.
        run: npm run build
        env:
          MOCK_APOD: "true"
